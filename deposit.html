<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit — Hunny Invests</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-shell"></div>

<script type="module">
  import { requireAuth } from "./js/guards.js";
  import { renderAppShell, toast, errorHTML, loadingHTML } from "./js/ui.js";
  import { createDepositRequest } from "./js/wallet.js";
  import { getUnreadCount } from "./js/notifications.js";
  import { isPositiveNumber, validateForm } from "./js/validators.js";
  import { getOne, COLLECTIONS } from "./js/firestore.js";
  import { escapeHTML } from "./js/utils.js";

  // Platform-controlled defaults — an admin can change or disable either
  // method any time from admin-settings.html without a code change; these
  // are only the fallback shown before that doc has ever been saved.
  const DEFAULT_SETTINGS = {
    bankEnabled: false,
    bankName: "Al Habib Bank",
    accountTitle: "Tariq Mehmood",
    accountNumber: "PK38 BAHL 20260908100107801",
    walletEnabled: true,
    walletTitle: "Tariq Mehmood",
    walletNumber: "0301-8858303",
    supportEmail: "Hunnycollectionpk@gmail.com"
  };

  async function init() {
    const session = await requireAuth(["investor"]);
    if (!session) return;
    const unreadCount = await getUnreadCount(session.user.uid);
    const page = renderAppShell({ role: "investor", active: "wallet", title: "Deposit Funds", profile: session.profile, unreadCount });
    page.innerHTML = loadingHTML("Loading payment instructions…");

    let settings;
    try {
      settings = { ...DEFAULT_SETTINGS, ...(await getOne(COLLECTIONS.PLATFORM_SETTINGS, "general")) };
    } catch (e) {
      console.error(e);
      page.innerHTML = errorHTML("Could not load payment instructions.", e);
      return;
    }

    const methodOptions = [];
    if (settings.walletEnabled) {
      methodOptions.push(
        { value: "easypaisa", label: "EasyPaisa" },
        { value: "jazzcash", label: "JazzCash" },
        { value: "sadapay", label: "SadaPay" },
        { value: "upaisa", label: "UPaisa" }
      );
    }
    if (settings.bankEnabled) {
      methodOptions.push({ value: "bank_transfer", label: "Bank Transfer" });
    }

    page.innerHTML = `
      <div class="alert alert--info">
        <strong>Step 1:</strong> Send your payment to the account below.<br>
        <strong>Step 2:</strong> Enter the amount and your transaction reference, then submit.<br>
        <strong>Step 3:</strong> Our admin team verifies your payment and approves the deposit — usually within a few hours.
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3>Payment Instructions</h3>
        ${settings.walletEnabled ? `
          <div class="kv-row"><span>Mobile Wallet</span><span>EasyPaisa · JazzCash · SadaPay · UPaisa</span></div>
          <div class="kv-row"><span>Account Title</span><span>${escapeHTML(settings.walletTitle)}</span></div>
          <div class="kv-row"><span>Number</span><span>${escapeHTML(settings.walletNumber)}</span></div>
        ` : ""}
        ${settings.bankEnabled ? `
          ${settings.walletEnabled ? `<hr class="divider">` : ""}
          <div class="kv-row"><span>Bank</span><span>${escapeHTML(settings.bankName)}</span></div>
          <div class="kv-row"><span>Account Title</span><span>${escapeHTML(settings.accountTitle)}</span></div>
          <div class="kv-row"><span>Account Number / IBAN</span><span>${escapeHTML(settings.accountNumber)}</span></div>
        ` : ""}
        ${!settings.walletEnabled && !settings.bankEnabled ? `<p class="text-muted">No deposit method is currently available. Please contact support at ${escapeHTML(settings.supportEmail)}.</p>` : ""}
      </div>

      <div class="card">
        <h3>Request a Deposit</h3>
        <div class="form-group">
          <label class="form-label">Amount (PKR)</label>
          <div class="input--prefix-wrap"><span class="input-prefix">PKR</span><input class="input" type="number" id="amount" min="1" placeholder="e.g. 5000"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select class="input" id="method" ${methodOptions.length ? "" : "disabled"}>
            ${methodOptions.length ? methodOptions.map((m) => `<option value="${m.value}">${m.label}</option>`).join("") : `<option>No method available</option>`}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Transaction Reference / Notes</label>
          <textarea class="input" id="reference" rows="3" placeholder="e.g. EasyPaisa TID 123456, sent 3 Sep 2026"></textarea>
        </div>
        <div class="form-error" id="form-error"></div>
        <button class="btn btn--primary btn--block" id="submit-btn" ${methodOptions.length ? "" : "disabled"}>Submit Deposit Request</button>
      </div>`;

    document.getElementById("submit-btn")?.addEventListener("click", async () => {
      const amount = Number(document.getElementById("amount").value);
      const method = document.getElementById("method").value;
      const reference = document.getElementById("reference").value.trim();
      const errorBox = document.getElementById("form-error");
      const { valid, errors } = validateForm({
        amount: { value: amount, rules: [[isPositiveNumber, "Enter a valid deposit amount."]] }
      });
      if (!valid) { errorBox.textContent = Object.values(errors)[0]; return; }
      errorBox.textContent = "";

      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.textContent = "Submitting…";
      try {
        await createDepositRequest({ userId: session.user.uid, amount, paymentMethod: method, referenceNote: reference });
        toast("Deposit request submitted. We'll notify you once it's approved.", "success");
        setTimeout(() => window.location.href = "wallet.html", 1000);
      } catch (e) {
        errorBox.textContent = e.message || "Could not submit deposit request.";
        btn.disabled = false; btn.textContent = "Submit Deposit Request";
      }
    });
  }

  init();
</script>
</body>
</html>
