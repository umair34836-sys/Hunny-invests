<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit — Hunny Invests</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-shell"></div>

<script type="module">
  import { requireAuth } from "./js/guards.js";
  import { renderAppShell, toast, errorHTML } from "./js/ui.js";
  import { createDepositRequest } from "./js/wallet.js";
  import { getUnreadCount } from "./js/notifications.js";
  import { isPositiveNumber, validateForm } from "./js/validators.js";

  async function init() {
    const session = await requireAuth(["investor"]);
    if (!session) return;
    const unreadCount = await getUnreadCount(session.user.uid);
    const page = renderAppShell({ role: "investor", active: "wallet", title: "Deposit Funds", profile: session.profile, unreadCount });

    page.innerHTML = `
      <div class="alert alert--info">
        <strong>Step 1:</strong> Send your payment to the account below.<br>
        <strong>Step 2:</strong> Enter the amount and your transaction reference, then submit.<br>
        <strong>Step 3:</strong> Our admin team verifies your payment and approves the deposit — usually within a few hours.
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3>Payment Instructions</h3>
        <div class="kv-row"><span>Bank</span><span>Meezan Bank</span></div>
        <div class="kv-row"><span>Account Title</span><span>Hunny Invests (Pvt.) Ltd.</span></div>
        <div class="kv-row"><span>Account Number</span><span>PK00 MEZN 0000 0000 1234 5678</span></div>
        <div class="kv-row"><span>Also accepted</span><span>EasyPaisa / JazzCash — contact support for details</span></div>
      </div>

      <div class="card">
        <h3>Request a Deposit</h3>
        <div class="form-group">
          <label class="form-label">Amount (PKR)</label>
          <div class="input--prefix-wrap"><span class="input-prefix">PKR</span><input class="input" type="number" id="amount" min="1" placeholder="e.g. 5000"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select class="input" id="method">
            <option value="bank_transfer">Bank Transfer</option>
            <option value="easypaisa">EasyPaisa</option>
            <option value="jazzcash">JazzCash</option>
            <option value="cash">Cash</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Transaction Reference / Notes</label>
          <textarea class="input" id="reference" rows="3" placeholder="e.g. Bank transfer ref# 123456, sent 3 Sep 2026"></textarea>
        </div>
        <div class="form-error" id="form-error"></div>
        <button class="btn btn--primary btn--block" id="submit-btn">Submit Deposit Request</button>
      </div>`;

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const amount = Number(document.getElementById("amount").value);
      const method = document.getElementById("method").value;
      const reference = document.getElementById("reference").value.trim();
      const errorBox = document.getElementById("form-error");
      const { valid, errors } = validateForm({
        amount: { value: amount, rules: [[isPositiveNumber, "Enter a valid deposit amount."]] }
      });
      if (!valid) { errorBox.textContent = Object.values(errors)[0]; return; }
      errorBox.textContent = "";

      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.textContent = "Submitting…";
      try {
        await createDepositRequest({ userId: session.user.uid, amount, paymentMethod: method, referenceNote: reference });
        toast("Deposit request submitted. We'll notify you once it's approved.", "success");
        setTimeout(() => window.location.href = "wallet.html", 1000);
      } catch (e) {
        errorBox.textContent = e.message || "Could not submit deposit request.";
        btn.disabled = false; btn.textContent = "Submit Deposit Request";
      }
    });
  }

  init();
</script>
</body>
</html>
