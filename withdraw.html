<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw — Hunny Invests</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-shell"></div>

<script type="module">
  import { requireAuth } from "./js/guards.js";
  import { renderAppShell, toast, loadingHTML, errorHTML } from "./js/ui.js";
  import { getWallet, createWithdrawalRequest, getPendingWithdrawalTotal } from "./js/wallet.js";
  import { getUnreadCount } from "./js/notifications.js";
  import { formatPKR } from "./js/utils.js";
  import { isPositiveNumber, isNonEmpty, validateForm } from "./js/validators.js";

  async function init() {
    const session = await requireAuth(["investor"]);
    if (!session) return;
    const unreadCount = await getUnreadCount(session.user.uid);
    const page = renderAppShell({ role: "investor", active: "wallet", title: "Withdraw Funds", profile: session.profile, unreadCount });
    page.innerHTML = loadingHTML("Loading…");

    const [wallet, pendingTotal] = await Promise.all([
      getWallet(session.user.uid),
      getPendingWithdrawalTotal(session.user.uid)
    ]);
    const withdrawable = Math.max(0, Number(wallet?.availableBalance || 0) - pendingTotal);

    page.innerHTML = `
      <div class="alert alert--info">Withdrawals are manually verified and processed by our admin team, typically within 24 hours.</div>
      <div class="card" style="margin-bottom:20px;">
        <div class="kv-row"><span>Available Balance</span><span class="money">${formatPKR(wallet?.availableBalance)}</span></div>
        <div class="kv-row"><span>Pending Withdrawal Requests</span><span>${formatPKR(pendingTotal)}</span></div>
        <div class="kv-row"><span>Withdrawable Now</span><span class="money">${formatPKR(withdrawable)}</span></div>
      </div>

      <div class="card">
        <h3>Request a Withdrawal</h3>
        <div class="form-group">
          <label class="form-label">Amount (PKR)</label>
          <div class="input--prefix-wrap"><span class="input-prefix">PKR</span><input class="input" type="number" id="amount" min="1" max="${withdrawable}" placeholder="e.g. 2000"></div>
          <p class="form-hint">Maximum withdrawable now: ${formatPKR(withdrawable)}</p>
        </div>
        <div class="form-group"><label class="form-label">Payment Method</label>
          <select class="input" id="method">
            <option value="bank_transfer">Bank Transfer</option>
            <option value="easypaisa">EasyPaisa</option>
            <option value="jazzcash">JazzCash</option>
            <option value="sadapay">SadaPay</option>
            <option value="upaisa">UPaisa</option>
          </select>
        </div>
        <div class="form-row form-row--2">
          <div class="form-group"><label class="form-label">Account Title</label><input class="input" id="accountTitle" placeholder="e.g. Ahmed Khan"></div>
          <div class="form-group"><label class="form-label">Account Number / IBAN</label><input class="input" id="accountNumber" placeholder="e.g. PK00XXXX0000000000"></div>
        </div>
        <div class="form-error" id="form-error"></div>
        <button class="btn btn--primary btn--block" id="submit-btn">Submit Withdrawal Request</button>
      </div>`;

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const amount = Number(document.getElementById("amount").value);
      const method = document.getElementById("method").value;
      const accountTitle = document.getElementById("accountTitle").value.trim();
      const accountNumber = document.getElementById("accountNumber").value.trim();
      const errorBox = document.getElementById("form-error");
      const { valid, errors } = validateForm({
        amount: { value: amount, rules: [[isPositiveNumber, "Enter a valid withdrawal amount."]] },
        accountTitle: { value: accountTitle, rules: [[isNonEmpty, "Account title is required."]] },
        accountNumber: { value: accountNumber, rules: [[isNonEmpty, "Account number is required."]] }
      });
      if (!valid) { errorBox.textContent = Object.values(errors)[0]; return; }
      if (amount > withdrawable) { errorBox.textContent = "Amount exceeds what you can withdraw right now."; return; }
      errorBox.textContent = "";

      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.textContent = "Submitting…";
      try {
        await createWithdrawalRequest({ userId: session.user.uid, amount, availableBalance: withdrawable, paymentMethod: method, accountTitle, accountNumber });
        toast("Withdrawal request submitted.", "success");
        setTimeout(() => window.location.href = "wallet.html", 1000);
      } catch (e) {
        errorBox.textContent = e.message || "Could not submit withdrawal request.";
        btn.disabled = false; btn.textContent = "Submit Withdrawal Request";
      }
    });
  }

  init();
</script>
</body>
</html>
