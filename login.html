<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Hunny Invests</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>

<main class="section container">
  <div class="card auth-card">
    <h1 style="font-size:22px;">Welcome back</h1>
    <p class="text-muted">Log in to your Hunny Invests account.</p>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="form-error" id="form-error"></div>
    <button class="btn btn--primary btn--block" id="login-btn">Log In</button>
    <p class="text-center" style="margin-top:14px;"><a href="#" id="forgot-link" style="font-size:13px;">Forgot password?</a></p>
    <hr class="divider">
    <p class="text-center text-muted" style="font-size:13.5px;">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderPublicNav, toast } from "./js/ui.js";
  import { loginUser, resetPassword } from "./js/auth.js";
  import { homeForRole, getOptionalSession } from "./js/guards.js";
  import { isValidEmail, isNonEmpty, validateForm } from "./js/validators.js";
  import { getQueryParam } from "./js/utils.js";

  (async () => {
    const session = await getOptionalSession();
    renderPublicNav("", session);
    if (session.user && session.userRecord) {
      window.location.href = homeForRole(session.userRecord.role);
    }
  })();

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("form-error");
    const { valid, errors } = validateForm({
      email: { value: email, rules: [[isValidEmail, "Enter a valid email address."]] },
      password: { value: password, rules: [[isNonEmpty, "Enter your password."]] }
    });
    if (!valid) { errorBox.textContent = Object.values(errors)[0]; return; }

    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      await loginUser(email, password);
      const redirect = getQueryParam("redirect");
      window.location.href = redirect ? decodeURIComponent(redirect) : "dashboard.html";
    } catch (e) {
      errorBox.textContent = "Invalid email or password.";
      btn.disabled = false; btn.textContent = "Log In";
    }
  });

  document.getElementById("forgot-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!isValidEmail(email)) { toast("Enter your email above first, then click Forgot Password.", "warning"); return; }
    try {
      await resetPassword(email);
      toast("Password reset email sent.", "success");
    } catch {
      toast("Could not send reset email.", "error");
    }
  });
</script>
</body>
</html>
